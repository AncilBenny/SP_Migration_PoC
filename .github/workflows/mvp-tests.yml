name: MVP Migration Studio checks
on:
  push:
    branches: ["mvp/**"]
  pull_request:
    paths:
      - "studio/**"
      - "poc/**"
      - "tests/**"
      - "docs/mvp/**"
      - "schema/**"
      - "requirements-dev.txt"
      - "requirements.txt"
      - ".github/workflows/mvp-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install schema and CSS compiler dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Unit, security, JSON Schema and local HTTP integration tests
        env:
          MIGRATION_REQUIRE_SCHEMA_VALIDATION: "1"
        run: python -m unittest discover -s tests -v
      - name: Compile application and engine
        run: python -m compileall -q poc studio
      - name: Smoke check source and output packaging
        run: |
          python - <<'PY'
          import io, json
          from zipfile import ZipFile
          from studio.service import ProjectStore
          studio = ProjectStore()
          project = studio.analyze(sample_id='modern-demo')
          output = studio.render(project['projectId'], mode='client')
          assert output['quality']['releaseDecision']['status'] == 'review-required'
          with ZipFile(io.BytesIO(studio.export(project['projectId'], 'client'))) as exported:
              assert 'index.html' in exported.namelist()
              assert 'quality-report.json' in exported.namelist()
          print('MVP local workflow smoke passed (not production approval)')
          PY
